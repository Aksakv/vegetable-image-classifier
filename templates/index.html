<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vegetable Image Classifier</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🥗 Vegetable Image Classifier</h1>

        <p class="subtitle">
            Deep Learning Based Vegetable Recognition System
        </p>

        <form action="/predict" method="POST" enctype="multipart/form-data">

            <input type="file" name="image" id="imageInput"  accept="image/*" required>

            <br><br>
            <img id="preview"
     src=""
     style="display:none; width:300px; border-radius:12px; border:4px solid darkgreen;">
<br><br>
            <button type="submit">
                🤖 Predict
            </button>

        </form>

        {% if prediction %}

        <div class="result-section">

            <h2>Uploaded Image</h2>

            <img src="{{ url_for('static', filename='uploads/' + image_file) }}"
                 width="300"
                 alt="Uploaded Image">

            <div class="result">

                <h2>Prediction</h2>

                <p>{{ prediction }}</p>

                <h2>Confidence</h2>
                <div class="progress-bar"
                     style="width: {{ confidence }}%;">

    {{ confidence }}%

</div>

</div>
            </div>

        </div>

        {% endif %}

    </div>

</body>
<script>
document.getElementById("imageInput").addEventListener("change", function(event){

    const file = event.target.files[0];

    if(file){

        const reader = new FileReader();

        reader.onload = function(e){

            const preview = document.getElementById("preview");

            preview.src = e.target.result;

            preview.style.display = "block";
        }

        reader.readAsDataURL(file);

    }

});
</script>

</html>
